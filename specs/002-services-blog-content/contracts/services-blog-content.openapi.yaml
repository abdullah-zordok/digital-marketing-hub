openapi: 3.1.0
info:
  title: Digital Marketing Hub - Services, Blog, and Content Management
  version: 0.1.0
  description: Public and admin content APIs for services, blog posts, categories, SEO metadata, and image uploads.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
tags:
  - name: Public Services
  - name: Admin Services
  - name: Public Blog
  - name: Admin Blog
  - name: Uploads
paths:
  /services:
    get:
      tags: [Public Services]
      summary: List published services
      operationId: listPublishedServices
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Published services in display order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
  /services/{slug}:
    get:
      tags: [Public Services]
      summary: Read a published service by slug
      operationId: getPublishedService
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Published service detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /admin/services:
    post:
      tags: [Admin Services]
      summary: Create a service draft
      operationId: createService
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceWriteRequest"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDetailResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
    get:
      tags: [Admin Services]
      summary: List services for admin management
      operationId: listAdminServices
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContentStatus"
      responses:
        "200":
          description: Admin service list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
  /admin/services/reorder:
    patch:
      tags: [Admin Services]
      summary: Reorder services
      operationId: reorderServices
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [id, sortOrder]
                    properties:
                      id:
                        type: string
                        format: uuid
                      sortOrder:
                        type: integer
                        minimum: 0
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /admin/services/{id}:
    get:
      tags: [Admin Services]
      summary: Read service for admin management
      operationId: getAdminService
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Admin service detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDetailResponse"
    patch:
      tags: [Admin Services]
      summary: Update service
      operationId: updateService
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceWriteRequest"
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDetailResponse"
    delete:
      tags: [Admin Services]
      summary: Delete service from normal workflows
      operationId: deleteService
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /admin/services/{id}/publish:
    patch:
      tags: [Admin Services]
      summary: Publish service
      operationId: publishService
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Published service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDetailResponse"
  /admin/services/{id}/unpublish:
    patch:
      tags: [Admin Services]
      summary: Unpublish service
      operationId: unpublishService
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Unpublished service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDetailResponse"
  /blog/posts:
    get:
      tags: [Public Blog]
      summary: List published blog posts
      operationId: listPublishedBlogPosts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Published blog posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostListResponse"
  /blog/posts/{slug}:
    get:
      tags: [Public Blog]
      summary: Read published blog post by slug
      operationId: getPublishedBlogPost
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Published blog post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /blog/categories:
    get:
      tags: [Public Blog]
      summary: List public blog categories
      operationId: listBlogCategories
      responses:
        "200":
          description: Blog categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogCategoryListResponse"
  /blog/categories/{slug}/posts:
    get:
      tags: [Public Blog]
      summary: List published posts for a public category
      operationId: listPublishedPostsByCategory
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Category post list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostListResponse"
  /admin/blog/posts:
    post:
      tags: [Admin Blog]
      summary: Create blog post draft
      operationId: createBlogPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostWriteRequest"
      responses:
        "201":
          description: Blog post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostDetailResponse"
    get:
      tags: [Admin Blog]
      summary: List blog posts for admin management
      operationId: listAdminBlogPosts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContentStatus"
      responses:
        "200":
          description: Admin blog post list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostListResponse"
  /admin/blog/posts/{id}:
    get:
      tags: [Admin Blog]
      summary: Read blog post for admin management
      operationId: getAdminBlogPost
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Admin blog post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostDetailResponse"
    patch:
      tags: [Admin Blog]
      summary: Update blog post
      operationId: updateBlogPost
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostWriteRequest"
      responses:
        "200":
          description: Blog post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostDetailResponse"
    delete:
      tags: [Admin Blog]
      summary: Delete blog post from normal workflows
      operationId: deleteBlogPost
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /admin/blog/posts/{id}/publish:
    patch:
      tags: [Admin Blog]
      summary: Publish blog post
      operationId: publishBlogPost
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Published blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostDetailResponse"
  /admin/blog/posts/{id}/unpublish:
    patch:
      tags: [Admin Blog]
      summary: Unpublish blog post
      operationId: unpublishBlogPost
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Unpublished blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostDetailResponse"
  /admin/blog/categories:
    post:
      tags: [Admin Blog]
      summary: Create blog category
      operationId: createBlogCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogCategoryWriteRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogCategoryDetailResponse"
    get:
      tags: [Admin Blog]
      summary: List blog categories for admin management
      operationId: listAdminBlogCategories
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin category list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogCategoryListResponse"
  /admin/blog/categories/{id}:
    patch:
      tags: [Admin Blog]
      summary: Update blog category
      operationId: updateBlogCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogCategoryWriteRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogCategoryDetailResponse"
    delete:
      tags: [Admin Blog]
      summary: Delete blog category
      operationId: deleteBlogCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /admin/uploads:
    post:
      tags: [Uploads]
      summary: Upload a content image
      operationId: uploadContentImage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum: [SERVICE_ICON, SERVICE_COVER, BLOG_COVER, CONTENT_IMAGE]
      responses:
        "201":
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Search:
      name: search
      in: query
      schema:
        type: string
    Category:
      name: category
      in: query
      schema:
        type: string
    Tag:
      name: tag
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [newest, oldest, popular]
        default: newest
  responses:
    Success:
      description: Operation completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Authentication is required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: User is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: Duplicate slug or conflicting content state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Content was not found or is not publicly visible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SuccessResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
    ContentStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    SeoMetadata:
      type: object
      required: [title, description, canonicalUrl, openGraphImage]
      properties:
        title:
          type: string
        description:
          type: string
        canonicalUrl:
          type: string
          nullable: true
        openGraphImage:
          type: string
          nullable: true
    PageMeta:
      type: object
      required: [page, limit, totalItems, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    Service:
      type: object
      required: [id, name, title, slug, status, sortOrder, seo, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        title:
          type: string
        slug:
          type: string
        shortDescription:
          type: string
          nullable: true
        fullDescription:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        coverImage:
          type: string
          nullable: true
        benefits:
          type: array
          items:
            type: string
        processSteps:
          type: array
          items:
            type: string
        targetAudience:
          type: array
          items:
            type: string
        expectedResults:
          type: array
          items:
            type: string
        faqs:
          type: array
          items:
            type: object
            additionalProperties: true
        status:
          $ref: "#/components/schemas/ContentStatus"
        sortOrder:
          type: integer
        seo:
          $ref: "#/components/schemas/SeoMetadata"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ServiceWriteRequest:
      type: object
      required: [name, title, slug]
      properties:
        name:
          type: string
        title:
          type: string
        slug:
          type: string
        shortDescription:
          type: string
        fullDescription:
          type: string
        icon:
          type: string
        coverImage:
          type: string
        benefits:
          type: array
          items:
            type: string
        processSteps:
          type: array
          items:
            type: string
        targetAudience:
          type: array
          items:
            type: string
        expectedResults:
          type: array
          items:
            type: string
        faqs:
          type: array
          items:
            type: object
            additionalProperties: true
        sortOrder:
          type: integer
          minimum: 0
        seoTitle:
          type: string
        seoDescription:
          type: string
        canonicalUrl:
          type: string
        openGraphImage:
          type: string
    BlogCategory:
      type: object
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BlogCategoryWriteRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
    BlogPost:
      type: object
      required: [id, title, slug, status, tags, seo, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        coverImage:
          type: string
          nullable: true
        authorId:
          type: string
          format: uuid
          nullable: true
        category:
          $ref: "#/components/schemas/BlogCategory"
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ContentStatus"
        publishedAt:
          type: string
          format: date-time
          nullable: true
        readingTime:
          type: integer
          nullable: true
        seo:
          $ref: "#/components/schemas/SeoMetadata"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BlogPostWriteRequest:
      type: object
      required: [title, slug]
      properties:
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        content:
          type: string
        coverImage:
          type: string
        authorId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
        seoTitle:
          type: string
        seoDescription:
          type: string
        canonicalUrl:
          type: string
        openGraphImage:
          type: string
        readingTime:
          type: integer
          minimum: 0
    UploadedFile:
      type: object
      required: [id, filename, originalName, publicUrl, mimeType, sizeBytes, purpose, createdAt]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        originalName:
          type: string
        publicUrl:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        purpose:
          type: string
        createdAt:
          type: string
          format: date-time
    ServiceListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/Service"
                meta:
                  $ref: "#/components/schemas/PageMeta"
    ServiceDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Service"
    BlogPostListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/BlogPost"
                meta:
                  $ref: "#/components/schemas/PageMeta"
    BlogPostDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BlogPost"
    BlogCategoryListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/BlogCategory"
    BlogCategoryDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BlogCategory"
    UploadResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UploadedFile"
