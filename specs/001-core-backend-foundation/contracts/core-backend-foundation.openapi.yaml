openapi: 3.1.0
info:
  title: Digital Marketing Hub - Core Backend Foundation
  version: 0.1.0
  description: Foundation API contract for health, authentication, standardized responses, and protected admin verification.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
tags:
  - name: Health
  - name: Auth
  - name: Admin
paths:
  /health:
    get:
      tags: [Health]
      summary: Read backend health status
      operationId: getHealth
      responses:
        "200":
          description: Backend health details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccessResponse"
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in an admin user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sign-in succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out the current admin user
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sign-out succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /auth/me:
    get:
      tags: [Auth]
      summary: Read current admin identity
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh an admin session
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session refresh succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /admin/probe:
    get:
      tags: [Admin]
      summary: Verify protected admin access
      operationId: adminProbe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Protected admin access confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProbeSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Authentication is required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Authenticated user does not have sufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SuccessResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          minimum: 1
    SafeUser:
      type: object
      required: [id, email, role, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [ADMIN, EDITOR, VIEWER]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    HealthData:
      type: object
      required: [api, database, redis, environment, timestamp]
      properties:
        api:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok, unavailable]
        redis:
          type: string
          enum: [ok, unavailable]
        environment:
          type: string
        timestamp:
          type: string
          format: date-time
    AuthData:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/SafeUser"
        tokens:
          $ref: "#/components/schemas/AuthTokens"
    AdminProbeData:
      type: object
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: "#/components/schemas/SafeUser"
    HealthSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthData"
    AuthSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AuthData"
    UserSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SafeUser"
    AdminProbeSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminProbeData"
